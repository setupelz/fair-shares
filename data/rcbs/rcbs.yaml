# Remaining Carbon Budgets (RCBs) data
#
# A budget is the cumulative net CO2 from its baseline year to net-zero CO2.
# The label "TpL" names the warming T at net zero and the likelihood L of
# staying below it. Each source records:
#   - baseline_year: the budget runs from the start of this year
#   - unit: the unit of the values (Gt CO2)
#   - likelihood_scope: the uncertainty behind L. tcre-only: the transient
#     climate response to cumulative emissions only (AR6 WGI Table SPM.2,
#     IGCC "avoidance probability, TCRE uncertainty only"). tcre-zec-esf: TCRE,
#     zero-emissions commitment and Earth-system feedbacks (Lamboll et al. 2023).
#   - budget_metric: what T measures. warming-at-net-zero equals peak warming
#     only when the zero-emissions commitment is zero. Lamboll et al. (2023)
#     use peak warming.
#   - scenarios: label -> published value
#   - scenario_selection (optional): role-matched (default) or ar6-category.
#   - non_co2_basis (optional): the scenario database the budget was built on,
#     which supplies its non-CO2 set (default ar6). A budget assumes the
#     non-CO2 pathway of that database, so its non-CO2 set comes from it too.
#
# Scenario sets (src/fair_shares/library/utils/data/scenario_sets.py):
#   - volume-matched set, for the land-use deduction (co2-ffi), the convention
#     gap (co2) and the net CO2 behind the bunker term: scenarios that reach
#     net-zero CO2 by 2100 and whose cumulative net CO2 from 2020 to net zero
#     lies within volume_tolerance_gt of the budget from 2020. The budget from
#     2020 adds observed global net CO2 (Global Carbon Budget 2025) of 2020 to
#     the year before the baseline.
#   - temperature-matched set, for the non-CO2 pathway: scenarios with a
#     net-zero year whose median warming at net zero lies in
#     [T - temperature_half_width, T + temperature_half_width), for every
#     likelihood. Published budgets assume the median non-CO2 warming of
#     scenarios at T.
#   - ar6-category: AR6 WGIII category pools for every term,
#     1.5p50 -> C1, 2p67 -> C3, 2p50 -> C4. Other labels of the source use the
#     role-matched sets.
#   A set below min_scenarios is a configuration error naming the label.
#   Net zero is the first full year from 2020 at which the harmonised CO2 is
#   at or below zero. A scenario without one counts as net zero when its
#   harmonised or reported CO2 falls below 100 Mt CO2/yr by 2100, in the first
#   such year (AR6 WGIII Table SPM.2, note j; net_zero_years).
#
# Labels left out of the defaults (published value, Gt CO2, and the count of
# the volume-matched set, below min_scenarios):
#   - forster_2024 1.5p67 (150): 6 volume-matched scenarios; 1.5p83 (100): 3.
#   - forster_2026 1.5p67 (80): 8 volume-matched scenarios; 1.5p83 (30): 5;
#     1.5p90 (10): 3.
#   - ar6_wg1_2021 1.5p83 (300): 6 volume-matched scenarios.
#   Counts from the AR6 reanalysis of Gidden et al. (2023).

# Largest distance between a scenario's cumulative net CO2 from 2020 to net
# zero and the budget from 2020, in Gt CO2.
volume_tolerance_gt: 50

# Half-width of the temperature-matched set, in degrees C.
temperature_half_width: 0.05

# Fewest scenarios in a volume-matched, temperature-matched or category set.
min_scenarios: 10

# Bunker term: observed bunkers from 2020 to the last observed year, plus a
# share s of the median net CO2 of the budget's set from the next year to net
# zero. Each scenario of scenario_sources that reports international aviation
# and shipping and reaches net zero gives a ratio: its cumulative bunkers over
# its own net CO2 in the same window. Net zero uses the run's own net CO2 in
# the AR6 convention (crossing of zero, else the first year below 100 Mt), so
# the climate emulator behind a source does not enter. A run carried over from
# another listed source counts once. No historical vetting applies to these
# reporters. s is the median of the per-family medians of the ratios (model
# families in src/fair_shares/conf/scenario_sources.yaml); a family counts only
# with at least min_runs_per_family reporters. AR6 category
# budgets apply the same s to their category set. A source whose data file is
# absent is left out with a warning; fewer than min_reporters reporters or
# min_families families is an error.
bunkers:
  scenario_sources: [ar6, sci, scenariomip]
  min_reporters: 10
  min_families: 3
  min_runs_per_family: 3

# Observed global net CO2 behind the budget from 2020 (registry: gcb-2025-global).
observed_co2_path: "data/emissions/gcb-2025/Global_Carbon_Budget_2025_v1.0.xlsx"

# Largest number of years that the rebase to 2020 may fill. When a world series
# (fossil CO2, bunkers, LULUCF) ends before the year before the baseline, each
# later year takes the last observed value, with a warning. This is a
# placeholder until observed data are published. 0 turns the fill off. A source
# that needs more years is skipped.
rebase_fill_max_years: 1

rcb_data:
  # Lamboll et al. (2023), Nature Climate Change 13, 1360-1367,
  # "https://doi.org/10.1038/s41558-023-01848-5". From January 2023.
  # Non-CO2 from the AR6 scenario database (MAGICC v7.5.3 and FaIR).
  lamboll_2023:
    baseline_year: 2023
    unit: "Gt * CO2"
    likelihood_scope: tcre-zec-esf
    budget_metric: peak-warming
    non_co2_basis: ar6
    scenarios:
      "1.5p50": 250
      "2p50": 1220
      "2p66": 940
      "2p90": 500

  # Forster et al. (2024), IGCC 2023, Table 8, "https://doi.org/10.5194/essd-16-2625-2024".
  # From the start of 2024. Non-CO2 from the AR6 WGIII scenario database, by
  # the method of Lamboll et al. (2023).
  forster_2024:
    baseline_year: 2024
    unit: "Gt * CO2"
    likelihood_scope: tcre-only
    budget_metric: warming-at-net-zero
    non_co2_basis: ar6
    scenarios:
      "1.5p50": 200
      "1.7p50": 550
      "1.7p67": 450
      "1.7p83": 350
      "2p50": 1100
      "2p67": 900
      "2p83": 750

  # IPCC AR6 WGI, Table SPM.2, "https://www.ipcc.ch/report/ar6/wg1/". From 2020.
  # Built on the SR1.5 scenario database, which fair-shares does not hold; the
  # AR6 category pools stand in.
  ar6_2020:
    baseline_year: 2020
    unit: "Gt * CO2"
    likelihood_scope: tcre-only
    budget_metric: warming-at-net-zero
    scenario_selection: ar6-category
    non_co2_basis: ar6
    scenarios:
      "1.5p50": 500
      "2p50": 1350
      "2p67": 1150
      "2p83": 900

  # Forster et al (2026), IGCC 2025, ESSD 18, 3889-3933, Table 8,
  # "https://doi.org/10.5194/essd-18-3889-2026". Budgets from the start of 2026.
  # Non-CO2 from the AR6 WGIII scenarios aligned with net-zero CO2 (Sect. 9).
  forster_2026:
    baseline_year: 2026
    unit: "Gt * CO2"
    likelihood_scope: tcre-only
    budget_metric: warming-at-net-zero
    non_co2_basis: ar6
    scenarios:
      "1.5p50": 130
      "1.7p50": 500
      "1.7p67": 390
      "1.7p83": 300
      "1.7p90": 250
      "2p50": 1050
      "2p67": 860
      "2p83": 690
      "2p90": 600

  # IPCC AR6 WGI (2021), Table SPM.2, "https://doi.org/10.1017/9781009157896.001".
  # Budgets from the start of 2020. Built on the SR1.5 scenario database, which
  # fair-shares does not hold; the AR6 category pools stand in.
  ar6_wg1_2021:
    baseline_year: 2020
    unit: "Gt * CO2"
    likelihood_scope: tcre-only
    budget_metric: warming-at-net-zero
    scenario_selection: ar6-category
    non_co2_basis: ar6
    scenarios:
      "1.5p50": 500
      "1.5p67": 400
      "1.7p50": 850
      "1.7p67": 700
      "1.7p83": 550
      "2p50": 1350
      "2p67": 1150
      "2p83": 900
