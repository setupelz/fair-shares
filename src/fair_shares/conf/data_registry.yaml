  ipcc_ar6_gidden:
    tier: optional
    version: "v2"
    doi: "10.5281/zenodo.10158920"
    license: "CC-BY-4.0"
    redistributable: false
    citation: >-
      Gidden, M., Gasser, T., Grassi, G., Forsell, N., Janssens, I., Lamb, W. F.,
      Minx, J., Nicholls, Z., Steinhauser, J., & Riahi, K. (2023). Dataset for
      Gidden et al. 2023 Updated AR6 Mitigation Benchmarks using National
      Emissions Inventories (v2). Zenodo.
      https://doi.org/10.5281/zenodo.10158920 — paper: Gidden, M. J., et al.
      (2023). Aligning climate scenarios to emissions inventories shifts global
      benchmarks. Nature, 624, 102-108. https://doi.org/10.1038/s41586-023-06724-y
    # Where these files came from was an open question; settled 2026-08-03.
    # The Zenodo record holds one workbook with two sheets: `data` (50,003 rows
    # x 116 columns) and `meta` (914 x 97). The repository's ar6_gidden.xlsx and
    # metadata_ar6_gidden.xlsx are exactly those two sheets saved as separate
    # files — same size, same column names, same missing values, same text. 137
    # numbers out of 5.8 million differ in their last decimal place, which is
    # what happens when a spreadsheet is saved again, not different data.
    #
    # metadata_ar6_gidden.xlsx does NOT come from the restricted AR6 Scenarios
    # Database (10.5281/zenodo.5886911).
    # It is the `meta` sheet of this openly licensed record, so no restricted
    # AR6-database content is redistributed here.
    #
    # The pipeline reads the zip, so the download step writes both spreadsheets
    # and zips them. Only the downloaded workbook has a fixed hash: spreadsheets
    # and zips written again are never byte-for-byte identical, so the files we
    # build are checked by their structure as they are written.
    downloads:
      - url: "https://zenodo.org/api/records/10158920/files/10.5281_zenodo.10158920_gidden_et_al_2023_ar6_reanalysis_data.xlsx/content"
        transform: ar6-split
        sha256: "04a1d432d00374e6757b7e1d79b3caff565d5c4f9a8cbab809bd73e1b7237aa2"
        upstream_hash: "md5:cf117bd4905889f46839211265adac9d"
        size_bytes: 50439664
        outputs:
          - "scenarios/ipcc_ar6_gidden/ar6_gidden.xlsx"
          - "scenarios/ipcc_ar6_gidden/metadata_ar6_gidden.xlsx"
          - "scenarios/ipcc_ar6_gidden/ar6_gidden.zip"

