# Where every input file comes from, and how to tell you got the right one.
#
# Read by data_registry.py (which checks it) and data_fetch.py (which acts on
# it). Shown by `fair-shares fetch-data --list`, and copied into PROVENANCE.md
# next to the data after a download, so each file's licence and citation stay
# with the file rather than only in a README.
#
# Every DOI and licence here was verified against the upstream source
# (registrar lookup for DOIs, the provider's own licence page for terms).
# Where no DOI exists (WDI, OWID, UN WPP) there is no DOI field and the
# citation just names the publisher. No DOI is made up.
#
# The three hash fields
#
#   sha256           Fixed hash of the downloaded file. A mismatch stops the
#                    run; it is never downgraded to a warning.
#   upstream_hash    The hash the publisher themselves quote. Zenodo only
#                    publishes MD5, so these say `md5:`. For reference only.
#   reference_sha256 The hash of the version this analysis was built on, for
#                    files the publisher keeps rewriting. Reported, not
#                    enforced — see `unversioned` below.
#
# Hashes are taken from the publisher's file, NOT from the copy committed under
# data/. They are not always the same file. `.gitattributes` sets `* text=auto`,
# so git rewrites the line endings of text files when they are committed. Any
# source that ships Windows line endings (Melo, currently) therefore has a
# committed copy whose hash can never match the download. A hash has to describe
# what actually arrives.
#
# Worth knowing before these files are removed from the repository: once they
# arrive by download instead, text files will have the publisher's original line
# endings rather than git's rewritten ones. pandas does not care; anything
# comparing files byte by byte will.
#
# `unversioned: true` marks a source the publisher rewrites in place with no
# version number (World Bank and OWID bulk exports). A fixed hash there would
# flag a newer file rather than a broken one, and would break every fresh clone
# within months. Those entries use `reference_sha256` instead; the difference is
# reported clearly and the hash actually obtained goes into PROVENANCE.md.
#
# Tiers
#
#   default   Downloaded by plain `fair-shares fetch-data`. What a normal run needs.
#   optional  Only via `--all` or `--source <name>`. Large or specialised.
#   manual    Behind a licence-acceptance page. Never downloaded automatically;
#             printed instructions instead.
#   bundled   Ships with the repository and is not third-party data. Listed only
#             so every path in the config matches an entry here. Never downloaded.

version: 1

