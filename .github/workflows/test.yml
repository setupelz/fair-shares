# Run the test suite on every supported Python version.
# No raw data is fetched: the few tests that read a raw input file skip when
# it is absent and run locally, and the inputs are pinned by checksum.
# Auto-fetch inside tests stays disabled (tests/conftest.py), so the suite
# never touches the network.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run python -m pytest tests/ -q
