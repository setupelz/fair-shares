# Run the test suite on every supported Python version.
# Raw data is not in git: a fetch step downloads it (cached across runs,
# keyed on the registry). Auto-fetch inside tests stays disabled
# (tests/conftest.py) so the suite itself never touches the network.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Cache input data
        uses: actions/cache@v4
        with:
          path: |
            data/emissions
            data/gdp
            data/gini
            data/population
            data/lulucf
            data/scenarios/ipcc_ar6_gidden
          key: data-${{ hashFiles('src/fair_shares/conf/data_registry.yaml') }}
      - name: Fetch input data
        # GCB is licence-gated and cannot be fetched here; tests that need
        # it must skip when the file is absent.
        run: uv run fair-shares fetch-data --all
      - name: Test
        run: uv run python -m pytest tests/ -q
