  - doi: "10.5281/zenodo.17845154"
    used_by: cmip7-historical-2025.12.07
    verified: 2026-08-03
    registrar: DataCite
    evidence: >-
      CMIP7 ScenarioMIP historical timeseries, version DOI for release
      2025.12.07, Nicholls, Kikstra, Zecchetto & Hoegner. Resolves and is open.
      Its rights list is empty, which is why the licence is recorded separately
