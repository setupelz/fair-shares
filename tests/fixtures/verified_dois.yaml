  - doi: "10.5281/zenodo.10158920"
    used_by: ipcc_ar6_gidden
    verified: 2026-08-03
    registrar: DataCite
    evidence: >-
      Dataset for Gidden et al. 2023 updated AR6 mitigation benchmarks, v2.
