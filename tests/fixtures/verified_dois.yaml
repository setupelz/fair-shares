# DOIs that have been looked up and confirmed to exist.
#
# The data registry (src/fair_shares/conf/data_registry.yaml) may only claim a
# DOI that appears here. tests/unit/test_data_registry.py checks that, so a DOI
# typed into the registry without being looked up first fails the test suite.
#
# This file and the registry are written separately. With a single source, one
# edit would change both and the check would pass anyway.
#
# ---------------------------------------------------------------------------
# ADDING AN ENTRY
#
# Look the DOI up first. Never copy one from a paper, a README or memory, and
# never reconstruct one from a pattern.
#
# Check it at whichever registrar issued it:
#
#   DataCite (most dataset DOIs, including Zenodo)
#     https://api.datacite.org/dois/<url-encoded-doi>
#   Crossref (most journal articles, and some datasets)
#     https://api.crossref.org/works/<doi>
#   doi.org content negotiation (works for either, and for DOIs at neither)
#     curl -LH "Accept: application/vnd.citationstyles.csl+json" https://doi.org/<doi>
#
# Then record what you saw in `evidence` — enough that someone can tell whether
# the DOI points at the thing the registry says it does, not just that some
# record exists. Put the date you checked in `verified`.
#
# `pytest -m network` re-resolves every DOI below against the live registrars.
# That is a manual check, not part of the normal suite or CI, because it needs
# the network and depends on services being up.

verified:
  - doi: "10.5281/zenodo.15016289"
    used_by: primap-202503
    verified: 2026-08-03
    registrar: DataCite
    evidence: >-
      PRIMAP-hist national historical emissions time series v2.6.1, Gütschow,
      Busch & Pflüger. DataCite rights list gives cc-by-4.0; the Zenodo API
      reports access_right open and the same licence.

  - doi: "10.5281/zenodo.22876287"
    used_by: primap-202609
    verified: 2026-10-16
    registrar: DataCite
    evidence: >-
      The PRIMAP-hist national historical emissions time series (1750-2025)
      v2.8, Gütschow & Pflüger. DataCite reports version v2.8, publicationYear
      2026, rights cc-by-nc-sa-4.0. The Zenodo API gives the same licence and
      an md5 for the no-rounding netCDF that matches the downloaded file.

  - doi: "10.5281/zenodo.18352395"
    used_by: melo-2026
    verified: 2026-08-03
    registrar: DataCite
    evidence: >-
      The LULUCF Data Hub, Melo et al. DataCite reports version 3.1.1,
