# DOIs known to be wrong. The registry must never carry one of these.
known_bad:
  - doi: "10.5194/essd-16-5567-2024"
    verified: 2026-08-03
    evidence: >-
      Returns 404 at both DataCite and Crossref and fails doi.org content
      negotiation. It was the Global Carbon Budget DOI written in
      data/bunkers/gcb-2024/CITATION.md, and its year, volume and page range
      are all wrong too. The real one is 10.5194/essd-17-965-2025.
