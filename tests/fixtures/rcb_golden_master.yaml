      2022: 1649.3290775
      2023: 1180.521057
    2p83:
      2020: 2853.994815
      2021: 2522.731611
      2022: 1829.732873
      2023: 1462.5375215
    2p66:
      2020: 2901.91244
      2021: 2524.902436
      2022: 1961.33544
      2023: 1621.06979
