# Golden master for the adjusted budgets of lamboll_2023, forster_2024 and ar6_2020.
# Inputs come from the pipeline outputs of primap-202503 with melo-2026 and cover
# 2020 to 2023 in Mt CO2. The test pins these values; do not regenerate.
# `expected` holds the budgets with the bunker rebase: the rebase adds the bunkers of
# 2020 to the year before the baseline (rebase_bunkers_mt).
# For co2 the rebase adds observed NGHGI LULUCF for the same years (rebase_lulucf_mt)
# and the convention gap runs from the baseline year of the source to net zero
# (`convention_gap_median_from`, keyed by baseline year).
# `rcb_2020_without_bunker_rebase_mt` holds the budgets captured 2026-10-01 from
# rcbs_co2-ffi.csv and rcbs_co2.csv, when the rebase added fossil emissions only.
# `rcb_2020_with_gap_from_2020_mt` holds the co2 budgets captured 2026-10-01 from
# rcbs_co2.csv, when every source took the convention gap from 2020
# (`convention_gap_median_from_2020_captured_mt`).
