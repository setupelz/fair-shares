# Golden master for the adjusted budgets of lamboll_2023, forster_2024 and ar6_2020.
# Inputs come from the pipeline outputs of primap-202503 with melo-2026 and cover
# 2020 to 2023 in Mt CO2. The test pins these values.
# `expected` holds the budgets with the bunker rebase: the rebase adds the bunkers of
# 2020 to the year before the baseline (rebase_bunkers_mt).
# For co2 the rebase adds observed NGHGI LULUCF for the same years (rebase_lulucf_mt)
# and the convention gap runs from the baseline year of the source to net zero
# (`convention_gap_median_from`, keyed by baseline year).
# The bunker deduction counts observed bunkers 2020-2023 plus a share (0.05, set in
# the test) of the set's net CO2 from 2024 to net zero (regenerated 2026-10-16 when
# the bunker share replaced the scenario bunker pathway). forster_2024 and ar6_2020
# carry 2p67, their published likelihood.
inputs:
  world_fossil_co2_mt:
    2020: 34343.1362
    2021: 36068.3054
    2022: 36228.508400000006
    2023: 36737.4233
  world_co2_lulucf_mt:
    2020: -4121.601528
    2021: -3756.03238
    2022: -4209.201465
    2023: -4274.392925
  bunkers_mt:
    2020: 870.9263603658384
    2021: 911.739887821367
    2022: 1039.5388075214562
    2023: 1137.0650964616757
  scenario_adjustments:
    1.5p50:
      bm_lulucf_cumulative_median: -53642.7
      convention_gap_median_from: {2020: -90280.9, 2023: -71238.1, 2024: -65410.0}
      nz_year_median: 2050
      nz_year_min: 2034
      nz_year_max: 2075
      n_scenarios: 70
      n_reaching_nz: 70
    2p83:
      bm_lulucf_cumulative_median: -58710.7
      convention_gap_median_from: {2020: -119745.7, 2023: -100236.4, 2024: -94415.2}
      nz_year_median: 2057
      nz_year_min: 2040
      nz_year_max: 2078
      n_scenarios: 106
      n_reaching_nz: 106
    2p66:
      bm_lulucf_cumulative_median: -87539.1
      convention_gap_median_from: {2020: -145477.8, 2023: -125793.3, 2024: -119566.0}
